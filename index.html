<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 뽑기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>랜덤 뽑기</h1>

    <div class="panel">
      <label>총 명수</label>
      <input type="number" id="total" min="1" value="10">

      <label>뽑을 명수</label>
      <input type="number" id="count" min="1" value="3">

      <button id="drawBtn" class="main-btn">🎯 뽑기</button>
      <button id="resetBtn">🔄 리셋</button>
    </div>

  <h2>결과</h2>
  <div id="result" class="result-box"></div>

  <h2>명단 (터치해서 제외)</h2>
  <div id="list" class="list-grid"></div>
</div>

  <script src="main.js"></script>

</body>
</html>
